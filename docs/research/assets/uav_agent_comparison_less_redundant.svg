<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b82018"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0d2b67"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 40px; font-weight: 700; fill: #081a46; }
      .red-title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #b20f0f; }
      .green-title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #1b5e20; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-style: italic; fill: #10213f; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #071933; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #071933; }
      .caption { font-family: Georgia, 'Times New Roman', serif; font-size: 25px; fill: #000000; }
    </style>
  </defs>

  <rect width="1800" height="1000" fill="#ffffff"/>
  <text x="900" y="50" text-anchor="middle" class="title">Comparison: Task-specific UAV-VLN Pipelines vs. Unified UAV-Agent Runtime</text>

  <!-- Left panel -->
  <rect x="28" y="82" width="710" height="800" rx="16" fill="#fffdfc" stroke="#f05b47" stroke-width="2" stroke-dasharray="9 9"/>
  <text x="383" y="128" text-anchor="middle" class="red-title">Existing Task-specific Paradigms</text>
  <text x="383" y="160" text-anchor="middle" class="subtitle">Diverse tasks lead to dedicated components</text>

  <!-- Left task collection -->
  <rect x="70" y="195" width="625" height="150" rx="14" fill="#ffffff" stroke="#f05b47" stroke-width="2"/>
  <text x="383" y="230" text-anchor="middle" class="label">Diverse UAV-VLN Tasks</text>
  <g id="left-task-tags">
    <rect x="95" y="255" width="145" height="42" rx="20" fill="#fff3f0" stroke="#f05b47" stroke-width="1.5"/>
    <text x="168" y="282" text-anchor="middle" class="small">Route Following</text>
    <rect x="250" y="255" width="130" height="42" rx="20" fill="#fff3f0" stroke="#f05b47" stroke-width="1.5"/>
    <text x="315" y="282" text-anchor="middle" class="small">Object Search</text>
    <rect x="390" y="255" width="150" height="42" rx="20" fill="#fff3f0" stroke="#f05b47" stroke-width="1.5"/>
    <text x="465" y="282" text-anchor="middle" class="small">Fine Control</text>
    <rect x="550" y="255" width="120" height="42" rx="20" fill="#fff3f0" stroke="#f05b47" stroke-width="1.5"/>
    <text x="610" y="282" text-anchor="middle" class="small">Dialogue</text>
    <text x="383" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#8a2f22">Each task tends to define its own data, policy, and rules.</text>
  </g>

  <!-- Left branching arrows -->
  <line x1="383" y1="345" x2="383" y2="395" stroke="#b82018" stroke-width="3" marker-end="url(#arrow-red)"/>
  <line x1="383" y1="395" x2="175" y2="445" stroke="#b82018" stroke-width="3" marker-end="url(#arrow-red)"/>
  <line x1="383" y1="395" x2="383" y2="445" stroke="#b82018" stroke-width="3" marker-end="url(#arrow-red)"/>
  <line x1="383" y1="395" x2="590" y2="445" stroke="#b82018" stroke-width="3" marker-end="url(#arrow-red)"/>

  <!-- Left dedicated component clusters -->
  <g id="separate-datasets">
    <rect x="80" y="445" width="190" height="135" rx="12" fill="#ffffff" stroke="#f05b47" stroke-width="2"/>
    <ellipse cx="175" cy="488" rx="37" ry="12" fill="#e24e39" stroke="#8f1d14" stroke-width="2"/>
    <rect x="138" y="488" width="74" height="42" fill="#e24e39" stroke="#8f1d14" stroke-width="2"/>
    <ellipse cx="175" cy="530" rx="37" ry="12" fill="#cf3928" stroke="#8f1d14" stroke-width="2"/>
    <line x1="138" y1="504" x2="212" y2="504" stroke="#ffffff" stroke-width="2"/>
    <line x1="138" y1="519" x2="212" y2="519" stroke="#ffffff" stroke-width="2"/>
    <text x="175" y="562" text-anchor="middle" class="label">Separate</text>
    <text x="175" y="588" text-anchor="middle" class="label">Datasets</text>
  </g>

  <g id="separate-policies">
    <rect x="288" y="445" width="190" height="135" rx="12" fill="#ffffff" stroke="#f05b47" stroke-width="2"/>
    <circle cx="340" cy="500" r="8" fill="#d83a2e"/>
    <circle cx="383" cy="477" r="8" fill="#d83a2e"/>
    <circle cx="426" cy="500" r="8" fill="#d83a2e"/>
    <circle cx="360" cy="530" r="8" fill="#d83a2e"/>
    <circle cx="406" cy="530" r="8" fill="#d83a2e"/>
    <line x1="340" y1="500" x2="383" y2="477" stroke="#d83a2e" stroke-width="4"/>
    <line x1="383" y1="477" x2="426" y2="500" stroke="#d83a2e" stroke-width="4"/>
    <line x1="340" y1="500" x2="360" y2="530" stroke="#d83a2e" stroke-width="4"/>
    <line x1="426" y1="500" x2="406" y2="530" stroke="#d83a2e" stroke-width="4"/>
    <text x="383" y="562" text-anchor="middle" class="label">Separate</text>
    <text x="383" y="588" text-anchor="middle" class="label">Policies</text>
  </g>

  <g id="separate-rules">
    <rect x="496" y="445" width="190" height="135" rx="12" fill="#ffffff" stroke="#f05b47" stroke-width="2"/>
    <rect x="550" y="470" width="58" height="38" rx="8" fill="#d83a2e"/>
    <path d="M566 508 L556 520 L580 508 Z" fill="#d83a2e"/>
    <circle cx="567" cy="489" r="3.5" fill="#ffffff"/>
    <circle cx="580" cy="489" r="3.5" fill="#ffffff"/>
    <circle cx="593" cy="489" r="3.5" fill="#ffffff"/>
    <path d="M535 535 L650 535" stroke="#d83a2e" stroke-width="4"/>
    <path d="M552 525 L552 545 M590 525 L590 545 M628 525 L628 545" stroke="#d83a2e" stroke-width="4"/>
    <text x="591" y="562" text-anchor="middle" class="label">Separate</text>
    <text x="591" y="588" text-anchor="middle" class="label">Rules / Prompts</text>
  </g>

  <!-- Left warning -->
  <line x1="383" y1="580" x2="383" y2="620" stroke="#b82018" stroke-width="3" marker-end="url(#arrow-red)"/>
  <rect x="70" y="625" width="625" height="120" rx="14" fill="#fff3f0" stroke="#f05b47" stroke-width="2"/>
  <path d="M125 650 L165 722 L85 722 Z" fill="#d73325"/>
  <rect x="120" y="676" width="10" height="27" rx="5" fill="#ffffff"/>
  <circle cx="125" cy="713" r="5" fill="#ffffff"/>
  <text x="210" y="666" class="red-title">Hard to Transfer</text>
  <text x="210" y="702" class="red-title">High Adaptation Cost</text>
  <text x="210" y="738" class="red-title">New Task Requires New Pipeline</text>

  <!-- Center arrow -->
  <text x="825" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#071933">From dedicated</text>
  <text x="825" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#071933">pipelines to</text>
  <text x="825" y="452" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#071933">unified runtime</text>
  <line x1="760" y1="510" x2="875" y2="510" stroke="#0d2b67" stroke-width="16" marker-end="url(#arrow-blue)"/>

  <!-- Right panel -->
  <rect x="905" y="82" width="865" height="800" rx="16" fill="#fbfffb" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="1338" y="128" text-anchor="middle" class="green-title">Proposed Unified UAV-Agent Runtime</text>
  <text x="1338" y="160" text-anchor="middle" class="subtitle">Many tasks, one extensible agent framework</text>

  <!-- Right task collection and adapter -->
  <rect x="940" y="205" width="275" height="155" rx="14" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="1078" y="240" text-anchor="middle" class="label">Diverse UAV-VLN Tasks</text>
  <rect x="968" y="263" width="92" height="36" rx="18" fill="#f2fff2" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="1014" y="287" text-anchor="middle" class="small">Route</text>
  <rect x="1072" y="263" width="92" height="36" rx="18" fill="#f2fff2" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="1118" y="287" text-anchor="middle" class="small">Search</text>
  <rect x="968" y="310" width="92" height="36" rx="18" fill="#f2fff2" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="1014" y="334" text-anchor="middle" class="small">Fine Ctrl</text>
  <rect x="1072" y="310" width="92" height="36" rx="18" fill="#f2fff2" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="1118" y="334" text-anchor="middle" class="small">Dialogue</text>

  <line x1="1215" y1="282" x2="1275" y2="282" stroke="#2e7d32" stroke-width="4" marker-end="url(#arrow-green)"/>
  <line x1="1215" y1="330" x2="1275" y2="330" stroke="#2e7d32" stroke-width="4" marker-end="url(#arrow-green)"/>

  <!-- Runtime box -->
  <rect x="1275" y="200" width="320" height="420" rx="14" fill="#f7fbff" stroke="#1f4e79" stroke-width="2"/>
  <text x="1435" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#071933">Unified Runtime</text>

  <rect x="1300" y="258" width="270" height="58" rx="8" fill="#ffffff" stroke="#6d8eb8" stroke-width="1.8"/>
  <path d="M1324 285 h16 v-16 h16 v16 h16 v16 h-16 v16 h-16 v-16 h-16 z" fill="#70b761" stroke="#2e7d32" stroke-width="2"/>
  <text x="1455" y="293" text-anchor="middle" class="label">Task Adapter</text>

  <rect x="1300" y="330" width="270" height="58" rx="8" fill="#ffffff" stroke="#6d8eb8" stroke-width="1.8"/>
  <path d="M1324 348 q20 -13 40 0 v36 q-20 -13 -40 0 z" fill="#ffffff" stroke="#071933" stroke-width="3"/>
  <path d="M1364 348 q20 -13 40 0 v36 q-20 -13 -40 0 z" fill="#ffffff" stroke="#071933" stroke-width="3"/>
  <text x="1468" y="366" text-anchor="middle" class="label">Skill Knowledge</text>

  <rect x="1300" y="402" width="270" height="58" rx="8" fill="#ffffff" stroke="#6d8eb8" stroke-width="1.8"/>
  <ellipse cx="1355" cy="423" rx="27" ry="9" fill="#9d8bd8" stroke="#3b2f7a" stroke-width="2"/>
  <rect x="1328" y="423" width="54" height="28" fill="#9d8bd8" stroke="#3b2f7a" stroke-width="2"/>
  <ellipse cx="1355" cy="451" rx="27" ry="9" fill="#8f7ed0" stroke="#3b2f7a" stroke-width="2"/>
  <text x="1465" y="438" text-anchor="middle" class="label">Multimodal Memory</text>

  <rect x="1300" y="474" width="270" height="58" rx="8" fill="#ffffff" stroke="#6d8eb8" stroke-width="1.8"/>
  <path d="M1355 486 L1382 499 L1375 526 L1355 539 L1335 526 L1328 499 Z" fill="#4c8f9f" stroke="#15485a" stroke-width="3"/>
  <path d="M1344 512 l8 9 l18 -23" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <text x="1465" y="511" text-anchor="middle" class="label">Safe Execution</text>

  <rect x="1300" y="546" width="270" height="58" rx="8" fill="#ffffff" stroke="#6d8eb8" stroke-width="1.8"/>
  <rect x="1328" y="560" width="54" height="33" rx="8" fill="#1c62b5"/>
  <path d="M1343 593 L1335 604 L1357 593 Z" fill="#1c62b5"/>
  <circle cx="1344" cy="576" r="3.5" fill="#ffffff"/>
  <circle cx="1356" cy="576" r="3.5" fill="#ffffff"/>
  <circle cx="1368" cy="576" r="3.5" fill="#ffffff"/>
  <text x="1465" y="582" text-anchor="middle" class="label">AgentMessage</text>

  <!-- Right outcomes -->
  <line x1="1595" y1="318" x2="1630" y2="318" stroke="#2e7d32" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-green)"/>
  <line x1="1595" y1="430" x2="1630" y2="430" stroke="#2e7d32" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-green)"/>
  <line x1="1595" y1="542" x2="1630" y2="542" stroke="#2e7d32" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-green)"/>

  <rect x="1630" y="245" width="120" height="90" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="1.7"/>
  <path d="M1655 310 v-45" stroke="#071933" stroke-width="3"/>
  <rect x="1666" y="292" width="10" height="18" fill="#1f4e79"/>
  <rect x="1682" y="276" width="10" height="34" fill="#1f4e79"/>
  <rect x="1698" y="258" width="10" height="52" fill="#1f4e79"/>
  <text x="1690" y="354" text-anchor="middle" class="small">Generalize</text>

  <rect x="1630" y="380" width="120" height="90" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="1.7"/>
  <path d="M1672 414 h15 v-15 h15 v15 h15 v15 h-15 v15 h-15 v-15 h-15 z" fill="#70b761" stroke="#2e7d32" stroke-width="2"/>
  <text x="1690" y="489" text-anchor="middle" class="small">Plug-in Skills</text>

  <rect x="1630" y="515" width="120" height="90" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="1.7"/>
  <rect x="1660" y="535" width="60" height="48" rx="4" fill="#f7fbff" stroke="#071933" stroke-width="3"/>
  <path d="M1669 570 l8 8 l18 -24" fill="none" stroke="#1f4e79" stroke-width="4"/>
  <text x="1690" y="624" text-anchor="middle" class="small">Evaluation</text>

  <!-- Shared loop -->
  <rect x="1030" y="675" width="600" height="76" rx="12" fill="#f7fff7" stroke="#2e7d32" stroke-width="2"/>
  <text x="1070" y="722" class="small">Observe</text>
  <line x1="1138" y1="712" x2="1185" y2="712" stroke="#2e7d32" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="1200" y="722" class="small">Plan</text>
  <line x1="1248" y1="712" x2="1295" y2="712" stroke="#2e7d32" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="1310" y="722" class="small">Execute</text>
  <line x1="1388" y1="712" x2="1435" y2="712" stroke="#2e7d32" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="1450" y="722" class="small">Reply</text>
  <line x1="1500" y1="712" x2="1547" y2="712" stroke="#2e7d32" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="1562" y="722" class="small">Update</text>
  <line x1="1435" y1="620" x2="1435" y2="675" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrow-green)"/>

  <!-- Success box -->
  <rect x="940" y="775" width="790" height="74" rx="10" fill="#f4fff1" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="1040" cy="812" r="27" fill="#2e7d32"/>
  <path d="M1027 812 l10 11 l22 -26" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <text x="1340" y="804" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#1b5e20">Reusable Across Tasks · Plug-in Adaptation</text>
  <text x="1340" y="834" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1b5e20">Evidence-based Interaction</text>

  <!-- Caption -->
  <text x="55" y="925" class="caption">Figure 1. Existing methods often build task-specific datasets, policies, and rules, while UAV-Agent unifies task adaptation,</text>
  <text x="55" y="957" class="caption">knowledge, memory, safe execution, and communication.</text>
</svg>
