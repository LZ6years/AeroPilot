<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e79"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b23b3b"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="800" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#102a43">
    Task-specific UAV-VLN Pipelines vs. Unified UAV-Agent Runtime
  </text>

  <!-- Left panel -->
  <rect x="50" y="100" width="650" height="680" rx="18" fill="#fff7f2" stroke="#c45139" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="375" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#8a2f22">
    Existing Task-specific Paradigms
  </text>
  <text x="375" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#8a2f22">
    One task, one dataset, one pipeline
  </text>

  <!-- Pipeline cards left -->
  <g id="left-route-following">
    <rect x="85" y="220" width="580" height="92" rx="12" fill="#ffffff" stroke="#c45139" stroke-width="2"/>
    <circle cx="125" cy="266" r="24" fill="#f7c7bc" stroke="#c45139" stroke-width="2"/>
    <path d="M112 268 C120 248, 140 248, 148 268" fill="none" stroke="#8a2f22" stroke-width="4"/>
    <circle cx="148" cy="268" r="5" fill="#8a2f22"/>
    <text x="175" y="256" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#102a43">Route Following</text>
    <text x="175" y="282" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#415a6b">Dataset A</text>
    <line x1="285" y1="266" x2="365" y2="266" stroke="#b23b3b" stroke-width="3" marker-end="url(#arrow-red)"/>
    <rect x="385" y="238" width="145" height="56" rx="8" fill="#fde3dc" stroke="#c45139" stroke-width="2"/>
    <text x="457" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#102a43">Policy A</text>
  </g>

  <g id="left-object-search">
    <rect x="85" y="335" width="580" height="92" rx="12" fill="#ffffff" stroke="#c45139" stroke-width="2"/>
    <circle cx="125" cy="381" r="24" fill="#f7c7bc" stroke="#c45139" stroke-width="2"/>
    <rect x="114" y="370" width="22" height="22" fill="#8a2f22"/>
    <circle cx="140" cy="395" r="7" fill="none" stroke="#8a2f22" stroke-width="3"/>
    <line x1="145" y1="400" x2="155" y2="410" stroke="#8a2f22" stroke-width="3"/>
    <text x="175" y="371" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#102a43">Object Search</text>
    <text x="175" y="397" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#415a6b">Dataset B</text>
    <line x1="285" y1="381" x2="365" y2="381" stroke="#b23b3b" stroke-width="3" marker-end="url(#arrow-red)"/>
    <rect x="385" y="353" width="190" height="56" rx="8" fill="#fde3dc" stroke="#c45139" stroke-width="2"/>
    <text x="480" y="375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#102a43">Detector / Search</text>
    <text x="480" y="396" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#102a43">Strategy B</text>
  </g>

  <g id="left-fine-control">
    <rect x="85" y="450" width="580" height="92" rx="12" fill="#ffffff" stroke="#c45139" stroke-width="2"/>
    <circle cx="125" cy="496" r="24" fill="#f7c7bc" stroke="#c45139" stroke-width="2"/>
    <path d="M110 500 C123 470, 140 522, 154 490" fill="none" stroke="#8a2f22" stroke-width="4"/>
    <text x="175" y="486" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#102a43">Fine-grained Control</text>
    <text x="175" y="512" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#415a6b">Dataset C</text>
    <line x1="285" y1="496" x2="365" y2="496" stroke="#b23b3b" stroke-width="3" marker-end="url(#arrow-red)"/>
    <rect x="385" y="468" width="170" height="56" rx="8" fill="#fde3dc" stroke="#c45139" stroke-width="2"/>
    <text x="470" y="502" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#102a43">Control Policy C</text>
  </g>

  <g id="left-dialogue">
    <rect x="85" y="565" width="580" height="92" rx="12" fill="#ffffff" stroke="#c45139" stroke-width="2"/>
    <circle cx="125" cy="611" r="24" fill="#f7c7bc" stroke="#c45139" stroke-width="2"/>
    <rect x="108" y="599" width="34" height="23" rx="6" fill="#8a2f22"/>
    <circle cx="119" cy="611" r="3" fill="#ffffff"/>
    <circle cx="128" cy="611" r="3" fill="#ffffff"/>
    <circle cx="137" cy="611" r="3" fill="#ffffff"/>
    <text x="175" y="601" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#102a43">Dialogue Navigation</text>
    <text x="175" y="627" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#415a6b">Dataset D</text>
    <line x1="285" y1="611" x2="365" y2="611" stroke="#b23b3b" stroke-width="3" marker-end="url(#arrow-red)"/>
    <rect x="385" y="583" width="190" height="56" rx="8" fill="#fde3dc" stroke="#c45139" stroke-width="2"/>
    <text x="480" y="605" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#102a43">Help / Dialogue</text>
    <text x="480" y="626" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#102a43">Rule D</text>
  </g>

  <!-- Left warning box -->
  <rect x="115" y="690" width="500" height="70" rx="10" fill="#fde3dc" stroke="#b23b3b" stroke-width="3"/>
  <text x="365" y="720" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#8a2f22">
    Hard to Transfer · High Adaptation Cost
  </text>
  <text x="365" y="745" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8a2f22">
    New task requires a new pipeline
  </text>

  <!-- Center arrow and label -->
  <line x1="720" y1="430" x2="880" y2="430" stroke="#1f4e79" stroke-width="6" marker-end="url(#arrow-blue)"/>
  <rect x="725" y="365" width="150" height="50" rx="10" fill="#eef6ff" stroke="#1f4e79" stroke-width="2"/>
  <text x="800" y="386" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#102a43">
    unify task
  </text>
  <text x="800" y="406" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#102a43">
    adaptation
  </text>

  <!-- Right panel -->
  <rect x="900" y="100" width="650" height="680" rx="18" fill="#f4fbf6" stroke="#2e7d32" stroke-width="3"/>
  <text x="1225" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1b5e20">
    Proposed Unified UAV-Agent Runtime
  </text>
  <text x="1225" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1b5e20">
    Many tasks, one extensible agent framework
  </text>

  <!-- Task inputs to unified runtime -->
  <g id="right-task-inputs">
    <rect x="930" y="225" width="170" height="48" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <text x="1015" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#102a43">Route Following</text>
    <rect x="930" y="292" width="170" height="48" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <text x="1015" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#102a43">Object Search</text>
    <rect x="930" y="359" width="170" height="48" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <text x="1015" y="389" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#102a43">Fine Control</text>
    <rect x="930" y="426" width="170" height="48" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <text x="1015" y="456" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#102a43">Top-down Geo</text>
    <rect x="930" y="493" width="170" height="48" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <text x="1015" y="523" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#102a43">Dialogue Task</text>
  </g>

  <!-- Unified runtime box -->
  <rect x="1150" y="220" width="350" height="330" rx="14" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/>
  <text x="1325" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1b5e20">
    Unified Runtime
  </text>

  <!-- arrows task inputs to runtime -->
  <line x1="1100" y1="249" x2="1150" y2="285" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="1100" y1="316" x2="1150" y2="330" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="1100" y1="383" x2="1150" y2="375" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="1100" y1="450" x2="1150" y2="420" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="1100" y1="517" x2="1150" y2="465" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrow-green)"/>

  <!-- Modules inside runtime -->
  <g id="runtime-modules">
    <rect x="1180" y="285" width="140" height="56" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="1250" y="319" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#102a43">Task Adapter</text>
    <rect x="1335" y="285" width="135" height="56" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="1402" y="309" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#102a43">Skill</text>
    <text x="1402" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#102a43">Knowledge</text>
    <rect x="1180" y="365" width="140" height="56" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="1250" y="389" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#102a43">Multimodal</text>
    <text x="1250" y="409" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#102a43">Memory</text>
    <rect x="1335" y="365" width="135" height="56" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="1402" y="399" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#102a43">Safe Execution</text>
    <rect x="1258" y="445" width="150" height="56" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="1333" y="479" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#102a43">AgentMessage</text>
  </g>

  <!-- Shared loop -->
  <rect x="1015" y="595" width="420" height="58" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="1225" y="630" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1b5e20">
    Observe → Plan → Execute → Reply → Update Memory
  </text>
  <line x1="1325" y1="550" x2="1325" y2="595" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrow-green)"/>

  <!-- Right success box -->
  <rect x="995" y="690" width="460" height="70" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="1225" y="720" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1b5e20">
    Reusable Across Tasks · Plug-in Adaptation
  </text>
  <text x="1225" y="745" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1b5e20">
    Evidence-based human-agent interaction
  </text>

  <!-- Bottom caption -->
  <rect x="70" y="815" width="1460" height="54" rx="10" fill="#f5f7fa" stroke="#d0d7de" stroke-width="2"/>
  <text x="800" y="848" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#102a43">
    Existing methods design dedicated datasets and strategies per task; UAV-Agent unifies task adaptation, memory, safe execution, and communication.
  </text>
</svg>
